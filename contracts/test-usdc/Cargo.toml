[package]
name = "test-usdc"
version = "1.0.0"
edition = "2018"   # upstream edition kept to avoid edition churn (contracts-spec §1.1)
publish = false
# The token is locked (no access keys), so it can never be redeployed: keep the link it was built with, or its source
# would stop building the deployed code (its NEP-330 metadata embeds this field).
repository = "https://github.com/pot-app/pot"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
