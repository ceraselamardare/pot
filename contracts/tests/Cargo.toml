[package]
name = "pot-tests"
version = "0.1.0"
license.workspace = true
edition = "2021"
publish = false
description = "Sandbox tests for pot-hub against both Sputnik builds (A = testnet global 278adc7, B = mainnet v3.2)"

[dependencies]
near-workspaces = "=0.23.0"
near-primitives = "=0.37.4"
near-crypto = "=0.37.4"
near-jsonrpc-client = "=0.22.0"
near-jsonrpc-primitives = "=0.37.4"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
near-token = "0.3"

[dev-dependencies]
proptest = "1"
